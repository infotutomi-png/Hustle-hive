# Sveltia CMS configuration for Hustle Hive
# Docs: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: dmac925/hive-fresh
  branch: main
  # OAuth worker that handles GitHub login (deployed to Cloudflare).
  base_url: https://sveltia-cms-auth.andrew-gove.workers.dev

# Where uploaded images are stored in the repo, and the URL they're served from.
media_folder: "static/images"
public_folder: "/images"

# Friendlier labels and UK English
locale: en

collections:
  # ---------------------------------------------------------------------------
  # HOME PAGE
  # ---------------------------------------------------------------------------
  - name: home
    label: "Home Page"
    delete: false
    editor:
      preview: false
    files:
      - name: home
        label: "Home Page Content"
        file: "src/lib/content/home.json"
        fields:
          - label: "Hero (top of page)"
            name: hero
            widget: object
            fields:
              - { label: "Logo image", name: logo, widget: image }
              - { label: "Heading — line 1", name: headingLine1, widget: string }
              - { label: "Heading — line 2", name: headingLine2, widget: string }
              - { label: "Subheading", name: subheading, widget: text }
              - { label: "Primary button — label", name: primaryButtonLabel, widget: string }
              - { label: "Primary button — link", name: primaryButtonHref, widget: string }
              - { label: "Secondary button — label", name: secondaryButtonLabel, widget: string }
              - { label: "Secondary button — link", name: secondaryButtonHref, widget: string }
          - label: "How can we help you? section"
            name: helpSection
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subheading", name: subheading, widget: text }
              - label: "Cards"
                name: cards
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Description", name: description, widget: text }
                  - label: "Icon"
                    name: icon
                    widget: select
                    options: ["graduation", "tools", "community"]
                  - { label: "Button label", name: linkLabel, widget: string }
                  - { label: "Button link", name: href, widget: string, hint: "Full web address (https://...) opens in a new tab" }
          - label: "Mission & Vision"
            name: mission
            widget: object
            fields:
              - { label: "Mission title", name: missionTitle, widget: string }
              - { label: "Mission text", name: missionText, widget: text }
              - { label: "Vision title", name: visionTitle, widget: string }
              - { label: "Vision text", name: visionText, widget: text }
              - { label: "Link label", name: learnMoreLabel, widget: string }
              - { label: "Link URL", name: learnMoreHref, widget: string }
          - label: "Programmes section"
            name: programmesSection
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subheading", name: subheading, widget: string }
              - label: "Programme cards"
                name: programmes
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Description", name: description, widget: text }
                  - { label: "Image", name: image, widget: image }
                  - label: "Icon"
                    name: icon
                    widget: select
                    options: ["pencil", "tent", "lightbulb", "rocket"]
                  - { label: "Link", name: href, widget: string }
                  - { label: "Image position (advanced — leave as-is)", name: imagePosition, widget: string, required: false }
                  - { label: "Coming soon?", name: comingSoon, widget: boolean, default: false }
          - label: "Makers to Market section"
            name: makersToMarket
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Tagline", name: tagline, widget: text }
              - { label: "Description", name: description, widget: text }
              - { label: "Button label", name: ctaLabel, widget: string }
              - { label: "Button link", name: ctaHref, widget: string }
              - label: "Carousel images"
                name: slides
                widget: list
                summary: "Image"
                fields:
                  - { label: "Image", name: image, widget: image }

  # ---------------------------------------------------------------------------
  # ABOUT PAGE
  # ---------------------------------------------------------------------------
  - name: about
    label: "About Page"
    delete: false
    editor:
      preview: false
    files:
      - name: about
        label: "About Page Content"
        file: "src/lib/content/about.json"
        fields:
          - { label: "Hero image", name: heroImage, widget: image }
          - { label: "Hero title", name: heroTitle, widget: string }
          - { label: "Hero subtitle", name: heroSubtitle, widget: string }
          - { label: "Mission title", name: missionTitle, widget: string }
          - { label: "Mission text", name: missionText, widget: text }
          - { label: "Vision title", name: visionTitle, widget: string }
          - { label: "Vision text", name: visionText, widget: text }
          - { label: "Values section title", name: valuesTitle, widget: string }
          - label: "Values"
            name: values
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: "Icon"
                name: icon
                widget: select
                options: ["people", "heart", "flag"]
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: text, widget: text }
          - { label: "Button label", name: ctaLabel, widget: string }
          - { label: "Button link", name: ctaHref, widget: string }

  # ---------------------------------------------------------------------------
  # PROGRAMMES LIST PAGE
  # ---------------------------------------------------------------------------
  - name: programmes
    label: "Programmes Page"
    delete: false
    editor:
      preview: false
    files:
      - name: programmes
        label: "Programmes Page Content"
        file: "src/lib/content/programmes.json"
        fields:
          - { label: "Page title", name: title, widget: string }
          - { label: "Page subtitle", name: subtitle, widget: string }
          - label: "Programmes"
            name: programmes
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Image", name: image, widget: image }
              - label: "Icon"
                name: icon
                widget: select
                options: ["pencil", "tent", "lightbulb", "rocket"]
              - { label: "Link", name: href, widget: string }
              - { label: "Image position (advanced — leave as-is)", name: imagePosition, widget: string, required: false }
              - { label: "Coming soon?", name: comingSoon, widget: boolean, default: false }

  # ---------------------------------------------------------------------------
  # UPCOMING EVENTS PAGE
  # ---------------------------------------------------------------------------
  - name: events
    label: "Events Page"
    delete: false
    editor:
      preview: false
    files:
      - name: events
        label: "Events Page Content"
        file: "src/lib/content/events.json"
        fields:
          - { label: "Page title", name: title, widget: string }
          - { label: "Page subtitle", name: subtitle, widget: string }
          - { label: "Notice banner title", name: noticeTitle, widget: string }
          - { label: "Notice banner text", name: noticeText, widget: text }
          - label: "Events"
            name: events
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Date", name: date, widget: string, hint: "e.g. 'TBC' or '12 June 2026'" }
              - label: "Category"
                name: category
                widget: select
                options:
                  - "Makers to Market"
                  - "Outdoor Education & Wellbeing"
                  - "Young People"
                  - "Community"
              - { label: "Description", name: description, widget: text }

  # ---------------------------------------------------------------------------
  # SHOP / MARKETPLACE
  # ---------------------------------------------------------------------------
  - name: shop
    label: "Shop Page"
    delete: false
    editor:
      preview: false
    files:
      - name: shop
        label: "Shop Page Content"
        file: "src/lib/content/shop.json"
        fields:
          - { label: "Page title", name: title, widget: string }
          - { label: "Page subtitle", name: subtitle, widget: string }
          - { label: "Info banner title", name: infoTitle, widget: string }
          - { label: "Info banner text", name: infoText, widget: text }
          - label: "Products"
            name: products
            widget: list
            summary: "{{fields.name}} — £{{fields.price}}"
            fields:
              - { label: "ID (lowercase, no spaces — used in the web address)", name: id, widget: string, pattern: ['^[a-z0-9-]+$', "Use only lowercase letters, numbers and dashes"] }
              - { label: "Name", name: name, widget: string }
              - { label: "Maker", name: maker, widget: string }
              - { label: "Price (£)", name: price, widget: number, value_type: float, min: 0 }
              - { label: "Image (grid thumbnail)", name: image, widget: image }
              - { label: "Image (large, on product page)", name: imageLarge, widget: image }
              - { label: "Description", name: description, widget: text }
              - label: "Details (bullet points)"
                name: details
                widget: list
                field: { label: "Detail", name: detail, widget: string }
