# Sveltia CMS configuration for Hustle Hive
# Docs: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: infotutomi-png/Hustle-hive
  branch: main
  # OAuth worker that handles "Sign in with GitHub" (see CMS-SETUP.md, Part A-C).
  # Until it's set up, use "Sign In Using Access Token" on the /admin login screen instead.
  # base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev

# Where uploaded images are stored in the repo, and the URL they're served from.
media_folder: "static/images"
public_folder: "/images"

# Friendlier labels and UK English
locale: en

collections:
  # ---------------------------------------------------------------------------
  # HOME PAGE
  # ---------------------------------------------------------------------------
  - name: home
    label: "Home Page"
    delete: false
    editor:
      preview: false
    files:
      - name: home
        label: "Home Page Content"
        file: "src/lib/content/home.json"
        fields:
          - label: "Hero (top of page)"
            name: hero
            widget: object
            fields:
              - { label: "Heading — line 1", name: headingLine1, widget: string }
              - { label: "Heading — line 2", name: headingLine2, widget: string }
              - { label: "Subheading", name: subheading, widget: text }
              - { label: "Button label", name: buttonLabel, widget: string }
              - { label: "Button link", name: buttonHref, widget: string, hint: "#happening-soon scrolls to the Happening soon section" }
              - label: "Pathway buttons"
                name: pathways
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Short description", name: text, widget: string }
                  - { label: "Link", name: href, widget: string }
                  - label: "Icon"
                    name: icon
                    widget: select
                    options: ["people", "graduation"]
              - { label: "Book a course button — label", name: bookLabel, widget: string }
              - { label: "Book a course button — link", name: bookHref, widget: string }
          - label: "Where to next? section (not shown on the homepage at the moment)"
            name: whereNext
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - label: "Cards"
                name: cards
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Description", name: description, widget: text }
                  - label: "Icon"
                    name: icon
                    widget: select
                    options: ["graduation", "tools", "lightbulb", "community"]
                  - { label: "Button label", name: linkLabel, widget: string }
                  - { label: "Button link", name: href, widget: string, hint: "Full web address (https://...) opens in a new tab" }
          - label: "About Hustle Hive section"
            name: about
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Text", name: text, widget: text }
              - { label: "Button label", name: buttonLabel, widget: string }
              - { label: "Button link", name: buttonHref, widget: string }
              - label: "Funding story (photo + text)"
                name: funding
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Text", name: text, widget: text }
                  - { label: "Photo", name: image, widget: image }
                  - { label: "Photo description (for screen readers)", name: imageAlt, widget: string }
                  - { label: "Button label", name: buttonLabel, widget: string }
                  - { label: "Button link", name: buttonHref, widget: string }
          - label: "Programmes grid (not shown on the homepage at the moment)"
            name: programmesSection
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subheading", name: subheading, widget: string }
              - label: "Programme cards"
                name: programmes
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Description", name: description, widget: text }
                  - { label: "Image", name: image, widget: image }
                  - label: "Icon"
                    name: icon
                    widget: select
                    options: ["pencil", "tent", "lightbulb", "rocket"]
                  - { label: "Link", name: href, widget: string }
                  - { label: "Image position (advanced — leave as-is)", name: imagePosition, widget: string, required: false }
                  - { label: "Coming soon?", name: comingSoon, widget: boolean, default: false }
          - label: "Makers to Market section (only the carousel images are shown, on the Makers to Market page)"
            name: makersToMarket
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Tagline", name: tagline, widget: text }
              - { label: "Description", name: description, widget: text }
              - { label: "Button label", name: ctaLabel, widget: string }
              - { label: "Button link", name: ctaHref, widget: string }
              - label: "Carousel images"
                name: slides
                widget: list
                summary: "Image"
                fields:
                  - { label: "Image", name: image, widget: image }

  # ---------------------------------------------------------------------------
  # HAPPENING SOON (homepage cards for holiday clubs, events, applications)
  # ---------------------------------------------------------------------------
  - name: happeningSoon
    label: "Happening Soon (homepage)"
    delete: false
    editor:
      preview: false
    files:
      - name: happeningSoon
        label: "Happening Soon cards"
        file: "src/lib/content/happening-soon.json"
        fields:
          - { label: "Heading", name: heading, widget: string }
          - label: "Cards"
            name: cards
            widget: list
            summary: "{{fields.title}} — {{fields.tagline}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Tagline (orange badge)", name: tagline, widget: string, hint: "e.g. 'October half term' or 'Applications open now'" }
              - { label: "Text", name: text, widget: text }
              - label: "Details"
                name: details
                widget: list
                required: false
                hint: "Short facts shown as tags, e.g. 'Ages 8–11'"
                field: { label: "Detail", name: detail, widget: string }
              - { label: "Button label", name: buttonLabel, widget: string }
              - { label: "Button link", name: buttonHref, widget: string, hint: "Full web address (https://...) opens in a new tab" }
              - { label: "End date", name: endDate, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false, hint: "The card hides automatically after this day. Leave empty to keep it showing." }
              - { label: "Image", name: image, widget: image, required: false, hint: "Leave empty to show a Hustle Hive placeholder" }
              - { label: "Image description (for screen readers)", name: imageAlt, widget: string }

  # ---------------------------------------------------------------------------
  # INSIDE THE HIVE (homepage photo strip)
  # ---------------------------------------------------------------------------
  - name: insideTheHive
    label: "Inside Hustle HQ (homepage photos)"
    delete: false
    editor:
      preview: false
    files:
      - name: insideTheHive
        label: "Inside Hustle HQ photos"
        file: "src/lib/content/inside-the-hive.json"
        fields:
          - { label: "Heading", name: heading, widget: string }
          - { label: "Line under the photos", name: caption, widget: string }
          - { label: "Button label", name: buttonLabel, widget: string }
          - { label: "Button link", name: buttonHref, widget: string }
          - label: "Photos"
            name: photos
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - { label: "Photo (square works best)", name: image, widget: image }
              - { label: "Photo description (for screen readers)", name: alt, widget: string }

  # ---------------------------------------------------------------------------
  # ABOUT PAGE
  # ---------------------------------------------------------------------------
  - name: about
    label: "About Page"
    delete: false
    editor:
      preview: false
    files:
      - name: about
        label: "About Page Content"
        file: "src/lib/content/about.json"
        fields:
          - { label: "Hero image", name: heroImage, widget: image }
          - { label: "Hero image description (for screen readers)", name: heroImageAlt, widget: string }
          - { label: "Hero title", name: heroTitle, widget: string }
          - { label: "Hero subtitle", name: heroSubtitle, widget: string }
          - { label: "Mission title", name: missionTitle, widget: string }
          - { label: "Mission text", name: missionText, widget: text }
          - { label: "Vision title", name: visionTitle, widget: string }
          - { label: "Vision text", name: visionText, widget: text }
          - { label: "Values section title", name: valuesTitle, widget: string }
          - label: "Values"
            name: values
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: "Icon"
                name: icon
                widget: select
                options: ["people", "heart", "flag"]
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: text, widget: text }
          - { label: "Team section title", name: foundersTitle, widget: string }
          - label: "Team"
            name: founders
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Role", name: role, widget: string }
              - { label: "Photo (square)", name: photo, widget: image }
              - { label: "Tagline", name: tagline, widget: string }
              - { label: "Bio", name: bio, widget: text }
          - label: "Safeguarding & policies (shown on /about/safeguarding)"
            name: safeguarding
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Intro", name: intro, widget: text }
              - { label: "Safeguarding box heading", name: leadHeading, widget: string }
              - { label: "Designated Safeguarding Lead", name: dsl, widget: string }
              - label: "Safeguarding points"
                name: points
                widget: list
                field: { label: "Point", name: point, widget: text }
              - { label: "Health & safety heading", name: healthHeading, widget: string }
              - label: "Health & safety paragraphs"
                name: health
                widget: list
                field: { label: "Paragraph", name: paragraph, widget: text }
              - { label: "Policies heading", name: policiesHeading, widget: string }
              - { label: "Policies intro", name: policiesIntro, widget: text }
              - label: "Policy groups"
                name: policyGroups
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Group title", name: title, widget: string }
                  - label: "Documents"
                    name: links
                    widget: list
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "Document name", name: label, widget: string }
                      - { label: "Link (Google Drive share link or page address)", name: href, widget: string }
          - label: "Inside Hustle HQ (kit)"
            name: hq
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Intro", name: intro, widget: text }
              - label: "Cards"
                name: cards
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - label: "Icon"
                    name: icon
                    widget: select
                    options: ["cube", "scissors", "press", "laptop"]
                  - { label: "Photo (optional — replaces the icon)", name: image, widget: image, required: false }
                  - { label: "Description", name: description, widget: text }
                  - label: "Kit"
                    name: kit
                    widget: list
                    field: { label: "Item", name: item, widget: string }
              - { label: "Text under the cards", name: outro, widget: text }
              - { label: "First button — label", name: primaryButtonLabel, widget: string }
              - { label: "First button — link", name: primaryButtonHref, widget: string }
              - { label: "Second button — label", name: secondaryButtonLabel, widget: string }
              - { label: "Second button — link", name: secondaryButtonHref, widget: string }
          - { label: "Button label", name: ctaLabel, widget: string }
          - { label: "Button link", name: ctaHref, widget: string }

  # ---------------------------------------------------------------------------
  # ALTERNATIVE PROVISION (/alternative-provision, /approach, /schools)
  # Every field in alternative-provision.json is listed so nothing is lost on save.
  # ---------------------------------------------------------------------------
  - name: alternativeProvision
    label: "Alternative Provision"
    delete: false
    editor:
      preview: false
    files:
      - name: alternativeProvision
        label: "Alternative Provision pages"
        file: "src/lib/content/alternative-provision.json"
        fields:
          - label: "Our provision page (/alternative-provision)"
            name: overview
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subheading", name: subheading, widget: string }
              - { label: "Intro", name: intro, widget: text }
              - label: "Hero photos"
                name: heroImages
                widget: list
                fields:
                  - { label: "Photo", name: image, widget: image }
                  - { label: "Description", name: alt, widget: string }
              - { label: "Price", name: price, widget: string }
              - { label: "Price unit", name: priceUnit, widget: string }
              - { label: "Price note", name: priceNote, widget: string }
              - label: "At a glance facts"
                name: facts
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: label, widget: string }
                  - { label: "Value", name: value, widget: string }
              - label: "Why choose us"
                name: why
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Paragraphs", name: paragraphs, widget: list, field: { label: "Paragraph", name: p, widget: text } }
                  - { label: "Photo", name: image, widget: image }
                  - { label: "Photo description", name: imageAlt, widget: string }
              - label: "Who we work with"
                name: who
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - { label: "Points", name: points, widget: list, field: { label: "Point", name: p, widget: text } }
                  - { label: "Suitability heading", name: suitabilityHeading, widget: string }
                  - { label: "Suitability paragraphs", name: suitability, widget: list, field: { label: "Paragraph", name: p, widget: text } }
                  - { label: "Accessibility", name: accessibility, widget: text }
              - label: "Our offer"
                name: offer
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Paragraphs", name: paragraphs, widget: list, field: { label: "Paragraph", name: p, widget: text } }
                  - { label: "Photo", name: image, widget: image }
                  - { label: "Photo description", name: imageAlt, widget: string }
              - label: "Experience & Engagement Days"
                name: days
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "Day types"
                    name: types
                    widget: list
                    fields:
                      - { label: "Title", name: title, widget: string }
                      - { label: "Text", name: text, widget: text }
                  - { label: "Note", name: note, widget: text }
                  - { label: "Photo", name: image, widget: image }
                  - { label: "Photo description", name: imageAlt, widget: string }
              - label: "Considering a placement? box"
                name: schoolsCta
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Text", name: text, widget: text }
              - label: "Gallery"
                name: gallery
                widget: list
                fields:
                  - { label: "Photo", name: image, widget: image }
                  - { label: "Description", name: alt, widget: string }
              - label: "AP contact section"
                name: contact
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "People"
                    name: people
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Name", name: name, widget: string }
                      - { label: "Role", name: role, widget: string }
                      - { label: "Email", name: email, widget: string }
          - label: "Approach & curriculum page (/alternative-provision/approach)"
            name: approach
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Intro", name: intro, widget: text }
              - label: "Mental health & resilience"
                name: resilience
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "Steps"
                    name: steps
                    widget: list
                    fields:
                      - { label: "Label", name: label, widget: string }
                      - { label: "Word", name: word, widget: string }
                      - { label: "Text", name: text, widget: text }
                  - { label: "Frameworks intro", name: frameworksIntro, widget: string }
                  - label: "Frameworks"
                    name: frameworks
                    widget: list
                    fields:
                      - { label: "Name (bold)", name: name, widget: string }
                      - { label: "Text", name: text, widget: text }
                  - { label: "Photo", name: image, widget: image }
                  - { label: "Photo description", name: imageAlt, widget: string }
              - label: "What our students do"
                name: activities
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "Groups"
                    name: groups
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Group title", name: title, widget: string }
                      - label: "Activities"
                        name: items
                        widget: list
                        summary: "{{fields.title}}"
                        fields:
                          - { label: "Title", name: title, widget: string }
                          - { label: "Text", name: text, widget: text }
                          - { label: "Hustle 100 tag", name: tag, widget: string }
              - label: "A day in the life"
                name: day
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - { label: "Note", name: note, widget: text }
                  - label: "Timetable"
                    name: timeline
                    widget: list
                    summary: "{{fields.time}} {{fields.title}}"
                    fields:
                      - { label: "Time", name: time, widget: string }
                      - { label: "Title", name: title, widget: string }
                      - { label: "Text", name: text, widget: text }
              - label: "Curriculum"
                name: curriculum
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Paragraphs", name: paragraphs, widget: list, field: { label: "Paragraph", name: p, widget: text } }
                  - { label: "Note", name: note, widget: text }
                  - { label: "Areas heading", name: areasHeading, widget: string }
                  - { label: "Areas of learning", name: areas, widget: list, field: { label: "Area", name: a, widget: string } }
                  - { label: "Image", name: image, widget: image }
                  - { label: "Image description", name: imageAlt, widget: string }
              - label: "Hustle 100"
                name: hustle100
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Tagline", name: tagline, widget: string }
                  - { label: "Paragraphs", name: paragraphs, widget: list, field: { label: "Paragraph", name: p, widget: text } }
                  - label: "Ten areas"
                    name: areas
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Name", name: name, widget: string }
                      - { label: "Colour (hex, e.g. #E5484D)", name: colour, widget: string }
                      - { label: "Challenges", name: points, widget: list, field: { label: "Challenge", name: p, widget: string } }
                  - { label: "Pathways heading", name: pathwaysHeading, widget: string }
                  - label: "Example pathways"
                    name: pathways
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Title", name: title, widget: string }
                      - { label: "Text", name: text, widget: text }
                      - { label: "Areas", name: areas, widget: list, field: { label: "Area", name: a, widget: string } }
                  - { label: "Quote", name: quote, widget: string }
                  - { label: "Full overview image", name: overviewImage, widget: image }
              - label: "Our ambition (outcomes)"
                name: ambition
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "Areas tracked"
                    name: items
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Title", name: title, widget: string }
                      - { label: "Text", name: text, widget: text }
          - label: "For schools & local authorities page (/alternative-provision/schools)"
            name: schools
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Intro", name: intro, widget: text }
              - label: "Referral & placement"
                name: referrals
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - { label: "Commissioner pack heading", name: packHeading, widget: string }
                  - { label: "Commissioner pack text", name: packText, widget: text }
                  - { label: "Commissioner pack details (pages/size)", name: packMeta, widget: string }
                  - label: "Referral steps"
                    name: steps
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Title", name: title, widget: string }
                      - { label: "Text", name: text, widget: text }
                  - { label: "Agreed list heading", name: agreedHeading, widget: string }
                  - { label: "Agreed before every placement", name: agreed, widget: list, field: { label: "Item", name: i, widget: string } }
              - label: "Monitoring & quality"
                name: monitoring
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Attendance heading", name: attendanceHeading, widget: string }
                  - { label: "Attendance points", name: attendance, widget: list, field: { label: "Point", name: p, widget: text } }
                  - { label: "Quality heading", name: qualityHeading, widget: string }
                  - { label: "Quality paragraphs", name: quality, widget: list, field: { label: "Paragraph", name: p, widget: text } }
                  - { label: "Due diligence heading", name: ddHeading, widget: string }
                  - { label: "Due diligence documents", name: dd, widget: list, field: { label: "Document", name: d, widget: string } }
                  - { label: "Due diligence note", name: ddNote, widget: string }
              - label: "Pricing"
                name: pricing
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Text", name: text, widget: text }
                  - { label: "Card heading", name: cardHeading, widget: string }
                  - { label: "Price", name: price, widget: string }
                  - { label: "Unit", name: unit, widget: string }
                  - { label: "Included", name: included, widget: list, field: { label: "Item", name: i, widget: string } }
              - label: "FAQs"
                name: faqs
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - label: "Questions"
                    name: items
                    widget: list
                    summary: "{{fields.q}}"
                    fields:
                      - { label: "Question", name: q, widget: string }
                      - { label: "Answer", name: a, widget: text }

  # ---------------------------------------------------------------------------
  # PROGRAMMES LIST PAGE (now the Community & Youth page)
  # ---------------------------------------------------------------------------
  - name: programmes
    label: "Community & Youth Page"
    delete: false
    editor:
      preview: false
    files:
      - name: programmes
        label: "Community & Youth Page Content"
        file: "src/lib/content/programmes.json"
        fields:
          - { label: "Page title", name: communityTitle, widget: string }
          - { label: "Page introduction", name: communityIntro, widget: text }
          - { label: "Programmes heading", name: title, widget: string }
          - { label: "Programmes subheading", name: subtitle, widget: string }
          - label: "Programmes"
            name: programmes
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Image", name: image, widget: image, required: false, hint: "Leave empty to show a Hustle Hive placeholder" }
              - label: "Icon"
                name: icon
                widget: select
                options: ["pencil", "tent", "lightbulb", "rocket", "sparkles", "tools", "map"]
              - { label: "Link", name: href, widget: string, hint: "Full web address (https://...) opens in a new tab" }
              - { label: "Button label (optional — default is Find out more)", name: buttonLabel, widget: string, required: false }
              - { label: "Label on the card (optional, e.g. Dates to be confirmed)", name: badge, widget: string, required: false }
              - { label: "Image position (advanced — leave as-is)", name: imagePosition, widget: string, required: false }
              - { label: "Coming soon?", name: comingSoon, widget: boolean, default: false }
              - { label: "Archived (hidden from the site)", name: archived, widget: boolean, default: false, hint: "Hides the card, sends its page to Community & Youth and leaves it out of the sitemap. Untick to bring it back." }
              - label: "Register interest — contact form subject"
                name: interestSubject
                widget: select
                required: false
                hint: "Used by the 'Register interest' button on coming-soon programmes"
                options: ["general", "makers-to-market", "holiday-clubs", "maker-days", "rangers", "school-referral", "after-school", "entrepreneurship-hub", "outdoor-education", "partnership", "volunteer", "other"]

  # ---------------------------------------------------------------------------
  # SHOP / MARKETPLACE
  # ---------------------------------------------------------------------------
  - name: shop
    label: "Shop Page (hidden from the site at the moment)"
    delete: false
    editor:
      preview: false
    files:
      - name: shop
        label: "Shop Page Content"
        file: "src/lib/content/shop.json"
        fields:
          - { label: "Page title", name: title, widget: string }
          - { label: "Page subtitle", name: subtitle, widget: string }
          - { label: "Info banner title", name: infoTitle, widget: string }
          - { label: "Info banner text", name: infoText, widget: text }
          - label: "Products"
            name: products
            widget: list
            summary: "{{fields.name}} — £{{fields.price}}"
            fields:
              - { label: "ID (lowercase, no spaces — used in the web address)", name: id, widget: string, pattern: ['^[a-z0-9-]+$', "Use only lowercase letters, numbers and dashes"] }
              - { label: "Name", name: name, widget: string }
              - { label: "Maker", name: maker, widget: string }
              - { label: "Price (£)", name: price, widget: number, value_type: float, min: 0 }
              - { label: "Image (grid thumbnail)", name: image, widget: image }
              - { label: "Image (large, on product page)", name: imageLarge, widget: image }
              - { label: "Description", name: description, widget: text }
              - label: "Details (bullet points)"
                name: details
                widget: list
                field: { label: "Detail", name: detail, widget: string }
